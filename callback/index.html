<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Tesla sign-in done</title>
<body style="font-family:system-ui;max-width:560px;margin:60px auto;padding:0 16px">
<h2>Signed in to Tesla</h2><p>Copy this code and paste it into your Grok Bot chat. It expires in a few minutes.</p>
<pre id="c" style="background:#eee;padding:12px;word-break:break-all;white-space:pre-wrap"></pre>
<button onclick="navigator.clipboard.writeText(document.getElementById('c').textContent)">Copy code</button>
<script>const p=new URLSearchParams(location.search);document.getElementById('c').textContent=p.get('code')||('Error: '+(p.get('error_description')||p.get('error')||'no code'));</script>
